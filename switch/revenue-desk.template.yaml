# Switch AI Room Template — Revenue Desk
# Compatible with Switch Console (v1.0+) Template Import

name: "revenue-desk"
version: "1.0.0"
description: >
  Revenue Desk brings two AI agents (Analyst & Reviewer) and a human manager 
  together in one room to analyze revenue drops, independently verify SQL numbers, 
  and execute approved sales campaigns with full decision lineage.

room:
  name: "#revenue-desk"
  topic: "Revenue Analytics & Campaign Action War Room"
  features:
    history: true
    tasks: true
    decisions: true
    rules: true
  rules:
    - "Analyst must provide executable SQL and exact figures for every insight."
    - "Reviewer must execute an independent verification query to catch discrepancies."
    - "Refunds and cancellations must be explicitly audited in repeat-purchase queries."
    - "No campaign execution or database mutations can occur without human manager sign-off."
    - "Every approval or rejection must be formally recorded in Switch Decisions."

agents:
  - name: "analyst"
    display_name: "Analyst Agent"
    role: "Revenue Data Analyst"
    provider: "groq"
    model: "openai/gpt-oss-120b"
    description: "Queries company database, analyzes sales trends, and drafts campaigns."
    addressing: anyone
    guardrails:
      require_human_approval_for:
        - "execute_campaign"
        - "write_database"
      max_tokens_per_task: 8000
    instructions: |
      You are the Analyst in the #revenue-desk room.
      - Receive revenue and sales questions from the manager.
      - Write and execute SQL queries against SQLite sales data.
      - Present clear month-over-month numbers and identify root causes.
      - Propose targeted win-back campaigns when drop-offs are detected.
      - Pause and await manager approval before any action.

  - name: "reviewer"
    display_name: "Reviewer Agent"
    role: "Data Quality & Verification"
    provider: "groq"
    model: "openai/gpt-oss-120b"
    description: "Independently cross-checks the Analyst's SQL and calculations."
    addressing: anyone
    guardrails:
      require_human_approval_for:
        - "write_database"
      max_tokens_per_task: 4000
    instructions: |
      You are the Reviewer in the #revenue-desk room.
      - When the Analyst posts an analysis, execute your OWN independent SQL query.
      - Actively check for hidden traps: duplicate charges, refunds, cancelled orders, segment mismatches.
      - Either confirm figures with ✅ Verified or flag discrepancies with ⚠️ Discrepancy Found.
      - Give the manager exact numbers so decisions are never based on faulty analysis.

