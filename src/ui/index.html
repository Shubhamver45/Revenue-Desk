<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Revenue Desk — React.js Multi-Agent Governance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ── Bespoke Enterprise Fintech Theme (Mercury / Stripe / Ramp) ── */
            --bg-canvas: #F8FAFC;
            --bg-card: #FFFFFF;
            --bg-subtle: #F1F5F9;
            --border-default: #E2E8F0;
            --border-subtle: #EDF2F7;
            --border-strong: #CBD5E1;

            --brand-obsidian: #0F172A;
            --brand-obsidian-hover: #1E293B;

            --color-emerald: #059669;
            --color-emerald-bg: #ECFDF5;
            --color-emerald-border: #A7F3D0;

            --color-crimson: #DC2626;
            --color-crimson-bg: #FEF2F2;
            --color-crimson-border: #FECACA;

            --color-blue: #2563EB;
            --color-blue-bg: #EFF6FF;

            --text-heading: #0F172A;
            --text-body: #334155;
            --text-muted: #64748B;
            --text-faint: #94A3B8;

            --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;

            --shadow-subtle: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
            --shadow-card: 0 1px 3px 0 rgba(0, 0, 0, 0.03), 0 1px 2px -1px rgba(0, 0, 0, 0.03);
            --shadow-modal: 0 20px 25px -5px rgba(15, 23, 42, 0.15), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        html, body {
            height: 100%;
            width: 100%;
            background: var(--bg-canvas);
            color: var(--text-body);
            font-family: var(--font-sans);
            font-size: 13px;
            line-height: 1.5;
            overflow-x: hidden;
        }

        #root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Top Navigation Bar ── */
        .navbar {
            background: #FFFFFF;
            border-bottom: 1px solid var(--border-default);
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
            flex-shrink: 0;
        }

        .nav-left { display: flex; align-items: center; gap: 14px; }
        .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-heading); cursor: pointer; }
        .brand-icon {
            width: 28px;
            height: 28px;
            background: var(--brand-obsidian);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .brand-title { font-size: 14.5px; font-weight: 800; letter-spacing: -0.3px; color: var(--text-heading); }
        .brand-tag {
            font-size: 10.5px;
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg-subtle);
            border: 1px solid var(--border-default);
            padding: 2px 7px;
            border-radius: 4px;
        }

        .react-badge {
            font-size: 10px;
            font-family: var(--font-mono);
            font-weight: 700;
            color: #0284C7;
            background: #F0F9FF;
            border: 1px solid #BAE6FD;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .nav-divider { width: 1px; height: 18px; background: var(--border-default); }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-emerald);
        }

        .nav-right { display: flex; align-items: center; gap: 8px; }

        .btn-primary {
            background: var(--brand-obsidian);
            border: 1px solid var(--brand-obsidian);
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn-primary:hover {
            background: var(--brand-obsidian-hover);
            border-color: var(--brand-obsidian-hover);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
        }

        .btn-ghost {
            background: #FFFFFF;
            border: 1px solid var(--border-default);
            color: var(--text-body);
            padding: 5px 11px;
            border-radius: var(--radius-sm);
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn-ghost:hover {
            background: var(--bg-subtle);
            color: var(--text-heading);
            border-color: var(--border-strong);
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 8px 3px 4px;
            background: #FFFFFF;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-heading);
        }

        .user-avatar {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            background: var(--brand-obsidian);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        /* ── Main Workspace ── */
        .workspace {
            max-width: 1540px;
            width: 100%;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
            min-height: 0;
            box-sizing: border-box;
        }

        /* ── 3 Focused Financial Cards ── */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            flex-shrink: 0;
        }

        .kpi-card {
            background: #FFFFFF;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: var(--shadow-card);
            transition: border-color 0.15s ease;
        }
        .kpi-card:hover { border-color: var(--border-strong); }

        .kpi-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .kpi-value {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            font-family: var(--font-mono);
            font-feature-settings: "tnum";
            color: var(--text-heading);
            margin: 2px 0;
        }
        .kpi-value.anomaly { color: var(--color-crimson); }
        .kpi-value.verified { color: var(--color-emerald); }

        .kpi-meta {
            font-size: 11.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ── 2-Column Grid ── */
        .grid-workspace {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 16px;
            align-items: stretch;
            flex: 1;
            min-height: 0;
        }

        .col-left {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
        }

        .chart-card {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 280px;
            overflow: hidden;
        }

        .card-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .card-title-group { display: flex; align-items: center; gap: 8px; }
        .card-title { font-size: 13.5px; font-weight: 700; color: var(--text-heading); }

        .pill-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-default);
            color: var(--text-muted);
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        .segment-toggle {
            display: flex;
            background: var(--bg-subtle);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 2px;
            gap: 2px;
        }

        .segment-btn {
            border: none;
            background: transparent;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.12s ease;
        }
        .segment-btn.active {
            background: #FFFFFF;
            color: var(--text-heading);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .canvas-wrap { flex: 1; width: 100%; min-height: 190px; position: relative; }
        canvas#revenueCanvas { width: 100%; height: 100%; display: block; }

        .chart-footer {
            padding: 9px 18px;
            background: var(--bg-subtle);
            border-top: 1px solid var(--border-default);
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-mono);
        }

        /* ── Policy Gate Card ── */
        .gate-card {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .gate-header { display: flex; align-items: center; justify-content: space-between; }
        .gate-status {
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            background: var(--color-emerald-bg);
            border: 1px solid var(--color-emerald-border);
            color: var(--color-emerald);
            font-family: var(--font-mono);
        }

        .stepper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: var(--bg-subtle);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-default);
            font-size: 11px;
            font-family: var(--font-mono);
        }

        .step-item { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 600; }
        .step-num {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #FFFFFF;
            border: 1px solid var(--border-default);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9.5px;
            font-weight: 700;
            color: var(--text-faint);
        }

        .step-item.active { color: #4F46E5; }
        .step-item.active .step-num { background: #4F46E5; border-color: #4F46E5; color: #fff; }
        .step-item.completed { color: var(--text-heading); }
        .step-item.completed .step-num { background: var(--color-emerald-bg); border-color: var(--color-emerald-border); color: var(--color-emerald); }

        .slider-section { display: flex; flex-direction: column; gap: 5px; }
        .slider-meta { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600; color: var(--text-body); }
        input[type="range"] { width: 100%; accent-color: var(--brand-obsidian); cursor: pointer; height: 4px; }

        .impact-table {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-family: var(--font-mono);
        }

        .impact-cell { display: flex; flex-direction: column; }
        .impact-lbl { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .impact-val { font-size: 13.5px; font-weight: 700; margin-top: 2px; }

        .gate-actions { display: flex; align-items: center; gap: 10px; }
        .btn-authorize {
            flex: 1;
            background: var(--brand-obsidian);
            border: 1px solid var(--brand-obsidian);
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 600;
            padding: 9px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        .btn-authorize:hover { background: var(--brand-obsidian-hover); }
        .btn-authorize:disabled { opacity: 0.6; cursor: default; }

        .btn-dismiss {
            background: #FFFFFF;
            border: 1px solid var(--border-default);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-dismiss:hover { background: var(--bg-subtle); color: var(--text-heading); }

        /* ── Right Column: Switch Multi-Agent Room ── */
        .col-right { display: flex; flex-direction: column; min-height: 0; }
        .room-card { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

        .room-tabs {
            display: flex;
            background: var(--bg-subtle);
            border-bottom: 1px solid var(--border-default);
            padding: 0 10px;
            gap: 4px;
            flex-shrink: 0;
        }

        .room-tab {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 9px 12px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .room-tab:hover { color: var(--text-heading); }
        .room-tab.active { color: var(--brand-obsidian); border-bottom-color: var(--brand-obsidian); background: #FFFFFF; }

        .quick-queries-bar {
            padding: 8px 16px;
            background: #FFFFFF;
            border-bottom: 1px solid var(--border-default);
            display: flex;
            gap: 6px;
            overflow-x: auto;
            flex-shrink: 0;
        }

        .quick-pill {
            background: var(--bg-subtle);
            border: 1px solid var(--border-default);
            color: var(--text-body);
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.12s ease;
        }
        .quick-pill:hover { background: #FFFFFF; border-color: var(--border-strong); color: var(--text-heading); }

        .feed-container {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #FAFAFC;
        }

        .empty-briefing {
            padding: 24px 18px;
            text-align: center;
            background: #FFFFFF;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .msg-row { display: flex; gap: 10px; animation: fadeIn 0.15s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .msg-avatar {
            width: 26px;
            height: 26px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            font-family: var(--font-mono);
            color: #FFFFFF;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg-content {
            flex: 1;
            background: #FFFFFF;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            box-shadow: var(--shadow-subtle);
            font-size: 12px;
            line-height: 1.55;
        }

        .msg-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .msg-author { font-weight: 700; color: var(--text-heading); font-size: 11.5px; }
        .msg-time { font-size: 10px; color: var(--text-faint); font-family: var(--font-mono); }

        .sql-box {
            margin-top: 8px;
            background: var(--brand-obsidian);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: #38BDF8;
            overflow-x: auto;
            line-height: 1.5;
        }

        .discrepancy-card {
            margin-top: 8px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-default);
            border-radius: 6px;
            padding: 8px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }

        .consensus-banner {
            margin-top: 8px;
            background: var(--color-emerald-bg);
            border: 1px solid var(--color-emerald-border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--color-emerald);
            font-weight: 700;
            font-size: 11px;
            font-family: var(--font-mono);
        }

        .chat-input-bar {
            padding: 10px 16px;
            background: #FFFFFF;
            border-top: 1px solid var(--border-default);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 7px 12px;
            font-size: 12px;
            font-family: inherit;
            color: var(--text-heading);
            background: #FFFFFF;
            outline: none;
            transition: border-color 0.15s;
        }
        .chat-input:focus { border-color: var(--brand-obsidian); }

        .chat-send-btn {
            background: var(--brand-obsidian);
            border: none;
            color: #FFFFFF;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s ease;
            flex-shrink: 0;
        }
        .chat-send-btn:hover { background: var(--brand-obsidian-hover); }

        /* ── Modals Base ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            background: #FFFFFF;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-lg);
            max-width: 840px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: var(--shadow-modal);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-default);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.12s;
        }
        .modal-close:hover { background: #E2E8F0; color: var(--text-heading); }

        .clean-table { width: 100%; border-collapse: collapse; font-size: 11.5px; text-align: left; }
        .clean-table th {
            padding: 8px 12px;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-default);
            font-family: var(--font-mono);
            text-transform: uppercase;
            font-size: 10px;
            background: var(--bg-subtle);
        }
        .clean-table td { padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); }
        .clean-table tr:hover td { background: var(--bg-canvas); }

        .task-card-item {
            background: #FFFFFF;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .rule-card-item {
            background: #FFFFFF;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 12px;
            color: var(--text-body);
        }

        .rule-badge {
            background: var(--bg-subtle);
            border: 1px solid var(--border-default);
            color: var(--text-heading);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        @media (max-width: 1024px) {
            .grid-workspace { grid-template-columns: 1fr; }
            .kpi-row { grid-template-columns: 1fr; }
            .navbar { padding: 0 14px; }
            .workspace { padding: 12px; }
        }
    </style>

    <!-- React 18 and Babel Standalone for React JSX SPA -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root">
        <!-- React Mount Target -->
        <div style="display:flex; align-items:center; justify-content:center; height:100vh; font-family:var(--font-mono); color:var(--text-muted); font-size:12px;">
            Initializing React.js Multi-Agent Governance Engine...
        </div>
    </div>

    <!-- ── React.js Application Components ── -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Default initial user
        const DEFAULT_USER = {
            name: "Alex Rivera",
            avatar: "AR",
            company: "Acme Cloud Inc.",
            role: "Lead Revenue Controller"
        };

        function App() {
            const [user, setUser] = useState(DEFAULT_USER);
            const [metrics, setMetrics] = useState({
                gross_revenue: 24250,
                refund_total: 20430,
                net_revenue: 3820,
                customer_count: 80,
                order_count: 160,
                refund_count: 8,
                trajectory: [
                    { label: "Jun", gross: 70510, net: 70510 },
                    { label: "Jul", gross: 74630, net: 74630 },
                    { label: "Aug", gross: 78350, net: 78350 },
                    { label: "Sep", gross: 85030, net: 85030 },
                    { label: "Oct", gross: 24250, net: 3820 }
                ]
            });

            const [comparisonMode, setComparisonMode] = useState("with");
            const [discount, setDiscount] = useState(15);
            const [pipeStep, setPipeStep] = useState(1);
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [isAuditing, setIsAuditing] = useState(false);

            const [activeTab, setActiveTab] = useState("chat");
            const [feed, setFeed] = useState([]);
            const [inputText, setInputText] = useState("");

            const [roomState, setRoomState] = useState({ tasks: [], decisions: [] });
            const [modal, setModal] = useState(null); // "yaml", "db", "memo"
            const [dbData, setDbData] = useState(null);
            const [dbTab, setDbTab] = useState("refunds");
            const [yamlSpec, setYamlSpec] = useState("");

            // Load initial state
            useEffect(() => {
                try {
                    let saved = localStorage.getItem("revenueDeskUser");
                    if (!saved) {
                        saved = JSON.stringify(DEFAULT_USER);
                        localStorage.setItem("revenueDeskUser", saved);
                    }
                    setUser(JSON.parse(saved));
                } catch(e) {}

                loadLiveMetrics();
                loadRoomState();
            }, []);

            const loadLiveMetrics = async () => {
                try {
                    const res = await fetch("/api/metrics/live");
                    if (res.ok) {
                        const data = await res.json();
                        setMetrics(data);
                    }
                } catch(e) {
                    console.warn("React load metrics:", e);
                }
            };

            const loadRoomState = async () => {
                try {
                    const res = await fetch("/api/state");
                    if (res.ok) {
                        const data = await res.json();
                        setRoomState(data);
                    }
                } catch(e) {
                    console.warn("React load state:", e);
                }
            };

            // Run autonomous multi-agent audit
            const runAudit = async (customQ) => {
                if (isAuditing) return;
                setIsAuditing(true);
                setActiveTab("chat");

                const q = customQ || "Why did repeat purchases drop in the West region last month?";
                const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

                // Step 1: Manager asks
                setFeed([
                    {
                        author: "@manager (Human Lead)",
                        avatar: "AR",
                        color: "#0F172A",
                        time: time,
                        content: q,
                        type: "text"
                    }
                ]);
                setPipeStep(2);

                try {
                    const res = await fetch("/api/ask", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ question: q })
                    });
                    const data = await res.json();

                    // Step 2: Analyst (800ms)
                    await new Promise(r => setTimeout(r, 800));
                    setPipeStep(3);

                    const analystMsg = {
                        author: "@analyst (SQL Engine • Groq 120B)",
                        avatar: "AN",
                        color: "#059669",
                        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                        content: data.analysis ? data.analysis.response : "Query executed against database records.",
                        sql: data.analysis ? data.analysis.sql : null,
                        type: "analyst"
                    };

                    setFeed(prev => [...prev, analystMsg]);

                    // Step 3: Reviewer (900ms)
                    await new Promise(r => setTimeout(r, 900));
                    setPipeStep(4);

                    const reviewerMsg = {
                        author: "@reviewer (Audit Guard • Groq 120B)",
                        avatar: "RV",
                        color: "#B45309",
                        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                        content: data.review ? data.review.response : "Independent audit query executed.",
                        hasDiscrepancy: true,
                        type: "reviewer"
                    };

                    setFeed(prev => [...prev, reviewerMsg]);

                    // Step 4: Consensus (700ms)
                    await new Promise(r => setTimeout(r, 700));
                    const consensusMsg = {
                        author: "Switch Consensus Engine (#revenue-desk)",
                        avatar: "SW",
                        color: "#0F172A",
                        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                        content: data.proposed_action || "100% Alignment Reached. Ready to authorize executive action.",
                        isConsensus: true,
                        type: "consensus"
                    };

                    setFeed(prev => [...prev, consensusMsg]);
                    loadRoomState();
                } catch(e) {
                    console.warn("Audit error:", e);
                } finally {
                    setIsAuditing(false);
                }
            };

            const approveCampaign = async () => {
                try {
                    const res = await fetch("/api/approve", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ response: `Approved. Change discount to ${discount}%.` })
                    });
                    const data = await res.json();
                    setIsAuthorized(true);
                    setPipeStep(5);

                    setFeed(prev => [
                        ...prev,
                        {
                            author: "@manager (Human Lead Sign-Off)",
                            avatar: "AR",
                            color: "#0F172A",
                            time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                            content: `Authorized execution of Win-Back Campaign at <strong>${discount}% discount</strong> under Switch Rule #4.`,
                            type: "manager"
                        },
                        {
                            author: "@analyst (Revenue Analyst)",
                            avatar: "AN",
                            color: "#059669",
                            time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
                            content: data.result || `Campaign created with status approved. 5 enterprise accounts enrolled at ${discount}% discount. Database mutations committed.`,
                            type: "analyst"
                        }
                    ]);

                    loadRoomState();
                    loadLiveMetrics();
                } catch(e) {
                    console.warn("Approve error:", e);
                }
            };

            const openModal = async (type) => {
                setModal(type);
                if (type === "yaml" && !yamlSpec) {
                    try {
                        const res = await fetch("/api/switch/template");
                        const d = await res.json();
                        setYamlSpec(d.template_yaml || d.room_yaml || "");
                    } catch(e) {
                        setYamlSpec("# Switch Spec error loading");
                    }
                } else if (type === "db" && !dbData) {
                    try {
                        const res = await fetch("/api/database");
                        const d = await res.json();
                        setDbData(d);
                    } catch(e) {
                        setDbData({});
                    }
                }
            };

            const resetState = async () => {
                try { await fetch("/api/reset"); } catch(e) {}
                window.location.reload();
            };

            return (
                <div style={{ display: "flex", flexDirection: "column", minHeight: "100vh" }}>
                    {/* ── Top Navigation Bar ── */}
                    <header className="navbar">
                        <div className="nav-left">
                            <div className="brand-logo" onClick={() => window.location.reload()}>
                                <div className="brand-icon">
                                    <svg viewBox="0 0 24 24" width="15" height="15" stroke="#FFFFFF" strokeWidth="2.2" fill="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                </div>
                                <span className="brand-title">Revenue Desk</span>
                                <span className="brand-tag">#revenue-desk</span>
                                <span className="react-badge">React 18 &bull; Node.js</span>
                            </div>

                            <div className="nav-divider"></div>

                            <div className="nav-status">
                                <span className="status-dot"></span>
                                <span>Ledger Synchronized ({metrics.customer_count || 80} Accounts &bull; {metrics.order_count || 160} Txns)</span>
                            </div>
                        </div>

                        <div className="nav-right">
                            <button className="btn-primary" onClick={() => runAudit()} disabled={isAuditing} title="Run autonomous multi-agent audit">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                <span>{isAuditing ? "Running Multi-Agent Audit..." : "Run Multi-Agent Audit"}</span>
                            </button>

                            <button className="btn-ghost" onClick={() => openModal("yaml")} title="View Switch Room Template (YAML)">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                <span>Room Spec (YAML)</span>
                            </button>

                            <button className="btn-ghost" onClick={() => openModal("db")} title="Inspect Live Ledger Transactions">
                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" strokeWidth="2" fill="none"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                                <span>Database (160 Txns)</span>
                            </button>

                            <button className="btn-ghost" onClick={() => openModal("memo")} title="Open Executive Operations Memo">
                                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" strokeWidth="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                <span>Audit Memo</span>
                            </button>

                            <button className="btn-ghost" onClick={resetState} title="Reset Session">Reset</button>

                            <div className="user-pill">
                                <div className="user-avatar">{user.avatar || "AR"}</div>
                                <span>{user.name || "Alex Rivera"}</span>
                            </div>
                        </div>
                    </header>

                    {/* ── Main Workspace ── */}
                    <main className="workspace">
                        {/* 3 Accounting KPI Cards */}
                        <section className="kpi-row">
                            <div className="kpi-card">
                                <span className="kpi-label">Reported October Gross Volume</span>
                                <span className="kpi-value">${Math.round(metrics.gross_revenue || 24250).toLocaleString()}.00</span>
                                <div className="kpi-meta">
                                    <span>15 transactions logged &bull; Apparent -84.2% drop</span>
                                </div>
                            </div>

                            <div className="kpi-card">
                                <span className="kpi-label">Gateway Duplicate Glitch</span>
                                <span className="kpi-value anomaly">-${Math.round(metrics.refund_total || 20430).toLocaleString()}.00</span>
                                <div className="kpi-meta" style={{ color: "var(--color-crimson)" }}>
                                    <span>{metrics.refund_count || 8} duplicate refund reversals unmasked across orders #1–#3</span>
                                </div>
                            </div>

                            <div className="kpi-card">
                                <span className="kpi-label">Certified Net Revenue Truth</span>
                                <span className="kpi-value verified">+${Math.round(metrics.net_revenue || 3820).toLocaleString()}.00</span>
                                <div className="kpi-meta" style={{ color: "var(--color-emerald)" }}>
                                    <span>7 verified clean orders &bull; Reconciled via Switch</span>
                                </div>
                            </div>
                        </section>

                        {/* 2-Column Grid */}
                        <div className="grid-workspace">
                            {/* Left Column */}
                            <div className="col-left">
                                {/* Revenue Trajectory Chart */}
                                <div className="card chart-card">
                                    <div className="card-header">
                                        <div className="card-title-group">
                                            <span className="card-title">Revenue Trajectory & Anomaly Inspection</span>
                                            <span className="pill-badge">West Region MoM</span>
                                        </div>

                                        <div className="segment-toggle">
                                            <button className={`segment-btn ${comparisonMode === "with" ? "active" : ""}`} onClick={() => setComparisonMode("with")}>
                                                <span style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--color-emerald)" }}></span>
                                                With Switch AI
                                            </button>
                                            <button className={`segment-btn ${comparisonMode === "without" ? "active" : ""}`} onClick={() => setComparisonMode("without")}>
                                                <span style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--color-crimson)" }}></span>
                                                Without Switch (Solo AI)
                                            </button>
                                        </div>
                                    </div>

                                    <div className="canvas-wrap">
                                        <RevenueCanvas points={metrics.trajectory} mode={comparisonMode} />
                                    </div>

                                    <div className="chart-footer">
                                        {comparisonMode === "without" ? (
                                            <span style={{ color: "var(--color-crimson)", fontWeight: 700 }}>
                                                🚨 Without Switch (Solo AI Blindness): Missed refund table, assumed 84.2% churn, burned -$9,550 margin.
                                            </span>
                                        ) : (
                                            <React.Fragment>
                                                <span style={{ color: "var(--color-crimson)", fontWeight: 700 }}>
                                                    Audited Anomaly: -${Math.round(metrics.refund_total || 20430).toLocaleString()}.00 duplicate loop &bull; Orders #1–#3
                                                </span>
                                                <span style={{ color: "var(--color-emerald)", fontWeight: 700 }}>
                                                    Certified Baseline: ${Math.round(metrics.net_revenue || 3820).toLocaleString()}.00 Net
                                                </span>
                                            </React.Fragment>
                                        )}
                                    </div>
                                </div>

                                {/* Policy Gate Card */}
                                <div className="card gate-card">
                                    <div className="gate-header">
                                        <div>
                                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                                <span className="rule-badge">SWITCH RULE #4</span>
                                                <span className="card-title">Human-in-the-Loop Sign-Off Gate</span>
                                            </div>
                                            <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 2 }}>
                                                Declarative guardrail: Database mutations blocked until Human Lead explicitly signs off.
                                            </div>
                                        </div>
                                        <span className="gate-status">{isAuthorized ? "Committed" : "Ready for Review"}</span>
                                    </div>

                                    <div className="stepper">
                                        <div className={`step-item ${pipeStep >= 1 ? (pipeStep > 1 ? "completed" : "active") : ""}`}><span className="step-num">{pipeStep > 1 ? "✓" : "1"}</span><span>TASK-101 (Ask)</span></div>
                                        <span style={{ color: "var(--border-strong)" }}>&rarr;</span>
                                        <div className={`step-item ${pipeStep >= 2 ? (pipeStep > 2 ? "completed" : "active") : ""}`}><span className="step-num">{pipeStep > 2 ? "✓" : "2"}</span><span>TASK-102 (SQL)</span></div>
                                        <span style={{ color: "var(--border-strong)" }}>&rarr;</span>
                                        <div className={`step-item ${pipeStep >= 3 ? (pipeStep > 3 ? "completed" : "active") : ""}`}><span className="step-num">{pipeStep > 3 ? "✓" : "3"}</span><span>TASK-103 (Audit)</span></div>
                                        <span style={{ color: "var(--border-strong)" }}>&rarr;</span>
                                        <div className={`step-item ${pipeStep >= 4 ? (pipeStep > 4 ? "completed" : "active") : ""}`}><span className="step-num">{pipeStep > 4 ? "✓" : "4"}</span><span>TASK-104 (Sign-Off)</span></div>
                                        <span style={{ color: "var(--border-strong)" }}>&rarr;</span>
                                        <div className={`step-item ${pipeStep >= 5 ? "completed" : ""}`}><span className="step-num">{pipeStep >= 5 ? "✓" : "5"}</span><span>TASK-105 (Commit)</span></div>
                                    </div>

                                    <div className="slider-section">
                                        <div className="slider-meta">
                                            <span>Renewal Incentive Calibration:</span>
                                            <span style={{ fontFamily: "var(--font-mono)", fontWeight: 700 }}>{discount}%</span>
                                        </div>
                                        <input type="range" min="5" max="25" step="5" value={discount} onChange={(e) => setDiscount(parseInt(e.target.value, 10))} />
                                    </div>

                                    <div className="impact-table">
                                        <div className="impact-cell">
                                            <span className="impact-lbl">Protected Pipeline</span>
                                            <span className="impact-val" style={{ color: "var(--color-emerald)" }}>+$38,200.00</span>
                                        </div>
                                        <div className="impact-cell">
                                            <span className="impact-lbl">Campaign Cost ({discount}%)</span>
                                            <span className="impact-val" style={{ color: "var(--color-crimson)" }}>-${Math.round(38200 * (discount / 100)).toLocaleString()}.00</span>
                                        </div>
                                        <div className="impact-cell">
                                            <span className="impact-lbl">Net Margin Contribution</span>
                                            <span className="impact-val" style={{ color: "var(--text-heading)" }}>+${Math.round(38200 * (1 - discount / 100)).toLocaleString()}.00</span>
                                        </div>
                                    </div>

                                    <div className="gate-actions">
                                        <button className="btn-authorize" onClick={approveCampaign} disabled={isAuthorized}>
                                            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" strokeWidth="2.2" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                                            <span>{isAuthorized ? "✓ Authorized & Committed to Ledger" : "Authorize Campaign Execution"}</span>
                                        </button>
                                        <button className="btn-dismiss" onClick={() => setFeed(prev => [...prev, { author: "@manager (Human Lead)", avatar: "AR", color: "#0F172A", time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }), content: "Revision requested on campaign terms before authorization." }])}>Dismiss</button>
                                    </div>
                                </div>
                            </div>

                            {/* Right Column: Switch Multi-Agent Room */}
                            <div className="col-right">
                                <div className="card room-card">
                                    <div className="card-header">
                                        <div>
                                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                                <span className="rule-badge" style={{ background: "var(--brand-obsidian)", color: "#fff", border: "none" }}>SWITCH ROOM</span>
                                                <span className="card-title" style={{ fontFamily: "var(--font-mono)", fontSize: 13.5 }}>#revenue-desk</span>
                                            </div>
                                            <div style={{ fontSize: 11, color: "var(--text-muted)", marginTop: 2 }}>
                                                Enforcing 5 Declarative Rules &bull; @analyst &bull; @reviewer &bull; @manager
                                            </div>
                                        </div>

                                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                                            <span className="pill-badge" style={{ color: "var(--color-emerald)", background: "var(--color-emerald-bg)", borderColor: "var(--color-emerald-border)" }}>● Consensus Active</span>
                                        </div>
                                    </div>

                                    {/* Tabs */}
                                    <div className="room-tabs">
                                        <button className={`room-tab ${activeTab === "chat" ? "active" : ""}`} onClick={() => setActiveTab("chat")}>Live Room Feed</button>
                                        <button className={`room-tab ${activeTab === "tasks" ? "active" : ""}`} onClick={() => setActiveTab("tasks")}>Switch Tasks ({roomState.tasks ? roomState.tasks.length : 5})</button>
                                        <button className={`room-tab ${activeTab === "decisions" ? "active" : ""}`} onClick={() => setActiveTab("decisions")}>Decision Ledger</button>
                                        <button className={`room-tab ${activeTab === "rules" ? "active" : ""}`} onClick={() => setActiveTab("rules")}>Governance Rules</button>
                                    </div>

                                    {/* Tab 1: Live Feed */}
                                    {activeTab === "chat" && (
                                        <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
                                            <div className="quick-queries-bar">
                                                <button className="quick-pill" onClick={() => runAudit("Why did repeat purchases drop in the West region last month?")}>Investigate West Drop</button>
                                                <button className="quick-pill" onClick={() => runAudit("Audit all duplicate billing refunds and gateway glitches")}>Audit Billing Glitches</button>
                                                <button className="quick-pill" onClick={() => runAudit("Show me all enterprise customers in West region")}>Show Enterprise Accounts</button>
                                                <button className="quick-pill" onClick={() => runAudit("What is the revenue breakdown by region?")}>Regional Breakdown</button>
                                            </div>

                                            <div className="feed-container">
                                                {feed.length === 0 ? (
                                                    <div className="empty-briefing">
                                                        <div style={{ fontWeight: 700, color: "var(--text-heading)", marginBottom: 4 }}>Switch Room #revenue-desk is standing by.</div>
                                                        Click <strong>"Run Multi-Agent Audit"</strong> or select an inquiry to trace how @analyst and @reviewer cross-check revenue discrepancies in real time.
                                                    </div>
                                                ) : (
                                                    feed.map((msg, idx) => (
                                                        <div key={idx} className="msg-row">
                                                            <div className="msg-avatar" style={{ background: msg.color }}>{msg.avatar}</div>
                                                            <div className="msg-content">
                                                                <div className="msg-header">
                                                                    <span className="msg-author">{msg.author}</span>
                                                                    <span className="msg-time">{msg.time}</span>
                                                                </div>
                                                                <div dangerouslySetInnerHTML={{ __html: msg.content }} />
                                                                {msg.sql && <div className="sql-box">{msg.sql}</div>}
                                                                {msg.hasDiscrepancy && (
                                                                    <div className="discrepancy-card">
                                                                        <div><span style={{ color: "#64748B", fontSize: 9.5 }}>GROSS ORDERS</span><br /><strong style={{ color: "#2563EB" }}>$24,250.00</strong></div>
                                                                        <div><span style={{ color: "#64748B", fontSize: 9.5 }}>GLITCH LOOP</span><br /><strong style={{ color: "var(--color-crimson)" }}>-$20,430.00</strong></div>
                                                                        <div><span style={{ color: "#64748B", fontSize: 9.5 }}>CERTIFIED NET</span><br /><strong style={{ color: "var(--color-emerald)" }}>$3,820.00</strong></div>
                                                                    </div>
                                                                )}
                                                                {msg.isConsensus && (
                                                                    <div className="consensus-banner">SWITCH CONSENSUS SEALED &bull; @analyst &check; @reviewer &check; Aligned</div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    ))
                                                )}
                                            </div>

                                            <div className="chat-input-bar">
                                                <input
                                                    type="text"
                                                    className="chat-input"
                                                    placeholder="Ask a financial question or command @analyst / @reviewer..."
                                                    value={inputText}
                                                    onChange={(e) => setInputText(e.target.value)}
                                                    onKeyDown={(e) => {
                                                        if (e.key === "Enter" && inputText.trim()) {
                                                            runAudit(inputText.trim());
                                                            setInputText("");
                                                        }
                                                    }}
                                                />
                                                <button className="chat-send-btn" onClick={() => { if (inputText.trim()) { runAudit(inputText.trim()); setInputText(""); } }} title="Send Message">
                                                    <svg viewBox="0 0 24 24" width="13" height="13" stroke="#FFFFFF" strokeWidth="2.2" fill="none"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* Tab 2: Switch Tasks */}
                                    {activeTab === "tasks" && (
                                        <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0, overflowY: "auto", padding: 16, gap: 8, background: "#FAFAFC" }}>
                                            <div style={{ fontSize: 11.5, color: "var(--text-muted)", marginBottom: 4 }}>
                                                Active workflow tasks tracked in Switch Room <code>#revenue-desk</code>:
                                            </div>
                                            {(roomState.tasks || []).map((t, idx) => (
                                                <div key={idx} className="task-card-item">
                                                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                                        <span className="rule-badge">{t.id}</span>
                                                        <div>
                                                            <div style={{ fontSize: 12, fontWeight: 700, color: "var(--text-heading)" }}>{t.title}</div>

                    </main>

                    {/* ── Modals ── */}
                    {modal === "yaml" && (
                        <div className="modal-overlay" onClick={() => setModal(null)}>
                            <div className="modal-box" onClick={(e) => e.stopPropagation()}>

                    {modal === "db" && (
                        <div className="modal-overlay" onClick={() => setModal(null)}>

                                <div style={{ display: "flex", gap: 6, marginBottom: 12, borderBottom: "1px solid var(--border-default)", paddingBottom: 6 }}>

                                        <button key={t} className="btn-ghost" style={{ background: dbTab === t ? "var(--bg-subtle)" : "transparent" }} onClick={() => setDbTab(t)}>

                    {modal === "memo" && (

                                <div style={{ borderBottom: "1px solid var(--border-default)", paddingBottom: 12, marginBottom: 14 }}>
                                    <div style={{ fontSize: 16, fontWeight: 800, color: "var(--text-heading)" }}>Executive Operations Memorandum</div>
                                    <div style={{ fontSize: 11.5, color: "var(--text-muted)" }}>Certified Financial Governance Audit — Revenue Desk</div>
                                </div>
                                <div style={{ fontSize: 12.5, color: "#334155", lineHeight: 1.7, display: "flex", flexDirection: "column", gap: 10 }}>
                                    <p><strong>1. Anomaly Overview:</strong> Analysis of October 2026 transactions flagged an apparent 84.2% drop in West region repeat revenues across enterprise accounts.</p>
                                    <p><strong>2. Reconciliation Audit:</strong> Independent review confirmed $20,430.00 in duplicate processor refund transactions occurring on orders #1, #2, and #3 during payment migration, identifying the certified net baseline at $3,820.00.</p>
                                    <div style={{ background: "var(--bg-subtle)", border: "1px solid var(--border-default)", borderRadius: 6, padding: "10px 14px", fontFamily: "var(--font-mono)", fontSize: 11.5 }}>
                                        <div>&bull; Gross October Orders: $24,250.00</div>
                                        <div>&bull; Duplicate Refund Reversals: -$20,430.00</div>
                                        <div>&bull; Certified Net Revenue Baseline: $3,820.00</div>
                                        <div style={{ color: "var(--color-emerald)", fontWeight: 700, marginTop: 4 }}>&bull; Protected Enterprise Pipeline: +$38,200.00</div>
                                    </div>

                                </div>
                                <div style={{ marginTop: 18, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                    <span style={{ fontSize: 11, fontFamily: "var(--font-mono)", color: "var(--text-faint)" }}>Integrity Signature: e9a7...38f1</span>

                    )}

        }

        // Dedicated Canvas Component for Revenue Trajectory
        function RevenueCanvas({ points, mode }) {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext("2d");
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;

                canvas.width = Math.round(rect.width * dpr);
                canvas.height = Math.round(rect.height * dpr);
                ctx.resetTransform ? ctx.resetTransform() : ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                const w = rect.width, h = rect.height;
                ctx.clearRect(0, 0, w, h);

                const dataPts = points || [
                    { label: "Jun", gross: 70510, net: 70510 },
                    { label: "Jul", gross: 74630, net: 74630 },
                    { label: "Aug", gross: 78350, net: 78350 },
                    { label: "Sep", gross: 85030, net: 85030 },
                    { label: "Oct", gross: 24250, net: 3820 }
                ];

                const maxVal = Math.max(...dataPts.map(p => Math.max(p.gross, p.net || 0)), 100000) * 1.15;
                const minVal = 0;

                // Y-axis grid
                const yDivisions = 4;
                ctx.fillStyle = "#64748B";
                ctx.font = "10px JetBrains Mono, monospace";
                ctx.textAlign = "right";

                for (let i = 0; i <= yDivisions; i++) {
                    const val = Math.round((maxVal * (yDivisions - i)) / yDivisions);
                    const y = 14 + i * ((h - 36) / yDivisions);
                    ctx.fillText("$" + (val >= 1000 ? Math.round(val / 1000) + "K" : val), 44, y + 3);
                    ctx.strokeStyle = "#F1F5F9";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(50, y);
                    ctx.lineTo(w - 14, y);
                    ctx.stroke();
                }

                // X-axis
                const numPoints = dataPts.length;
                const stepX = (w - 74) / Math.max(1, numPoints - 1);
                const mapX = (i) => 54 + i * stepX;
                const mapY = (val) => 14 + ((maxVal - val) / (maxVal - minVal)) * (h - 36);

                ctx.textAlign = "center";
                dataPts.forEach((p, i) => {
                    ctx.fillText(p.label, mapX(i), h - 4);
                });

                // Gross Reported Line (Blue)
                ctx.beginPath();
                ctx.moveTo(mapX(0), mapY(dataPts[0].gross));
                dataPts.forEach((p, i) => ctx.lineTo(mapX(i), mapY(p.gross)));
                ctx.strokeStyle = "#3B82F6";
                ctx.lineWidth = 2.2;
                ctx.stroke();

                dataPts.forEach((p, i) => {
                    ctx.beginPath();
                    ctx.arc(mapX(i), mapY(p.gross), 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = "#3B82F6";
                    ctx.fill();
                    ctx.strokeStyle = "#FFFFFF";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                });

                if (mode === "without") {
                    // Red failure drop line
                    const lastIdx = numPoints - 1;
                    ctx.beginPath();
                    ctx.setLineDash([4, 4]);
                    ctx.moveTo(mapX(lastIdx - 1), mapY(dataPts[lastIdx - 1].gross));
                    ctx.lineTo(mapX(lastIdx), mapY(0));
                    ctx.strokeStyle = "#DC2626";
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.beginPath();
                    ctx.arc(mapX(lastIdx), mapY(0), 4.5, 0, Math.PI * 2);
                    ctx.fillStyle = "#DC2626";
                    ctx.fill();
                    return;
                }

                // Certified Net Line (Emerald)
                ctx.beginPath();
                ctx.moveTo(mapX(0), mapY(dataPts[0].net));
                dataPts.forEach((p, i) => ctx.lineTo(mapX(i), mapY(p.net)));
                ctx.strokeStyle = "#059669";
                ctx.lineWidth = 2.0;
                ctx.stroke();

                dataPts.forEach((p, i) => {
                    ctx.beginPath();
                    ctx.arc(mapX(i), mapY(p.net), 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = "#059669";
                    ctx.fill();
                    ctx.strokeStyle = "#FFFFFF";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                });

                // Discrepancy connector
                const lastIdx = numPoints - 1;
                const pLast = dataPts[lastIdx];
                if (pLast && pLast.gross !== pLast.net) {
                    ctx.beginPath();
                    ctx.setLineDash([3, 3]);
                    ctx.moveTo(mapX(lastIdx), mapY(pLast.gross));
                    ctx.lineTo(mapX(lastIdx), mapY(pLast.net));
                    ctx.strokeStyle = "#DC2626";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }, [points, mode]);

            return <canvas ref={canvasRef} id="revenueCanvas" />;
        }

        // Render React Application to Root
        const rootElement = document.getElementById("root");
        if (rootElement) {
            ReactDOM.createRoot(rootElement).render(<App />);
        }
    </script>
