version: "3.8"

services:
  revenue-desk:
    build: .
    container_name: revenue-desk
    env_file: .env
    environment:
      - MODE=${MODE:-cli}
      - DB_PATH=/app/data/revenue_desk.db
    volumes:
      - ./data:/app/data
    stdin_open: true   # For interactive CLI mode
    tty: true          # For interactive CLI mode

  # Uncomment when running with Switch bridge mode:
